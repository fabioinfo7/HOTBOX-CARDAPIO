name: Validar HotBox

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - codex/checkout-unico-chat-app

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar checkout e banco
        run: node scripts/validate-checkout.mjs
      - name: Validar TypeScript
        run: npx tsc --noEmit
      - name: Gerar build de produção
        run: npm run build
